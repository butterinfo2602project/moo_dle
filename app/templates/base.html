<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Bulls and Cows{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='img/favicon.ico')}}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124, 58, 237, 0.08), transparent 25%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.08), transparent 25%),
                #f5f7fb;
            color: #111827;
        }

        .page-shell {
            min-height: 100vh;
            padding: 32px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .soft-card {
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
        }

        .form-control {
            min-height: 50px;
            border-radius: 14px;
            border: 1px solid #d1d5db;
            padding: 0.8rem 1rem;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.12);
        }

        .btn-main {
            border: none;
            border-radius: 14px;
            min-height: 48px;
            font-weight: 600;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: white;
        }

        .btn-main:hover {
            color: white;
            opacity: 0.95;
        }

        .btn-lightish {
            border: none;
            border-radius: 14px;
            min-height: 48px;
            font-weight: 600;
            background: #eef2ff;
            color: #312e81;
        }

        .btn-lightish:hover {
            background: #e0e7ff;
            color: #312e81;
        }

        .alert {
            border: none;
            border-radius: 14px;
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .muted-text {
            color: #6b7280;
        }
    </style>

    {% block external_css %}{% endblock %}
    {% block internal_css %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}
    {% block external_js %}{% endblock %}
</body>

</html>
