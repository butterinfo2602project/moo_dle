{% extends "base.html" %}

{% block internal_css %}
<style>
    .app-wrap {
        min-height: 100vh;
        padding: 24px;
    }

    .app-layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 22px;
    }

    .side-bar {
        background: linear-gradient(180deg, #111827, #1f2937);
        color: white;
        border-radius: 24px;
        padding: 24px 18px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.16);
        height: fit-content;
        position: sticky;
        top: 24px;
    }

    .user-box {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 24px;
    }

    .user-name {
        font-weight: 800;
        font-size: 1.15rem;
        margin-bottom: 4px;
    }

    .user-sub {
        color: #cbd5e1;
        font-size: 0.95rem;
        margin: 0;
    }

    .side-links {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .side-link {
        text-decoration: none;
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.06);
        color: #e5e7eb;
        transition: 0.2s ease;
        display: block;
    }

    .side-link:hover {
        background: rgba(255, 255, 255, 0.14);
        color: white;
    }

    .side-link.active {
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        color: white;
    }

    .logout-link {
        margin-top: 24px;
        display: block;
        text-decoration: none;
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 600;
        background: rgba(239, 68, 68, 0.16);
        color: #fecaca;
    }

    .logout-link:hover {
        background: rgba(239, 68, 68, 0.24);
        color: white;
    }

    .main-panel {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        min-height: 80vh;
    }

    @media (max-width: 900px) {
        .app-layout {
            grid-template-columns: 1fr;
        }

        .side-bar {
            position: static;
        }
    }
</style>

{% block additional_styles %}{% endblock %}
{% endblock %}

{% block content %}
<div class="app-wrap">
    <div class="container-fluid">
        <div class="app-layout">
            <aside class="side-bar">
                <div class="user-box">
                    <div class="user-name">{{ user.username }}</div>
                    <p class="user-sub">Daily Bulls and Cows</p>
                </div>

                <div class="side-links">
                    <a href="/app" class="side-link {% if request.path == '/app' %}active{% endif %}">Game</a>
                </div>

                <a href="/logout" class="logout-link">Logout</a>
            </aside>

            <main class="main-panel">
                {% block subpage_content %}{% endblock %}
            </main>
        </div>
    </div>
</div>
{% endblock %}
