{% extends "base.html" %}

{% block internal_css %}
<style>
    .app-wrap {
        min-height: 100vh;
        padding: 20px;
    }

    .app-layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 18px;
    }

    .side-bar {
        background: linear-gradient(180deg, #111827, #0f172a);
        color: white;
        border-radius: 20px;
        padding: 20px 16px;
        box-shadow: var(--shadow-main);
        border: 1px solid rgba(255,255,255,0.04);
        height: fit-content;
        position: sticky;
        top: 20px;
    }

    .user-box {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .user-name {
        font-weight: 800;
        font-size: 1.05rem;
        margin-bottom: 4px;
    }

    .user-sub {
        color: #9ca3af;
        font-size: 0.9rem;
        margin: 0;
    }

    .side-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .side-link {
        text-decoration: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 0.95rem;
        background: rgba(255, 255, 255, 0.04);
        color: #e5e7eb;
        transition: 0.2s ease;
        display: block;
    }

    .side-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    .side-link.active {
        background: linear-gradient(135deg, var(--accent-main), var(--accent-dark));
        color: white;
    }

    .logout-link {
        margin-top: 20px;
        display: block;
        text-decoration: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 0.95rem;
        background: rgba(239, 68, 68, 0.14);
        color: #fecaca;
    }

    .logout-link:hover {
        background: rgba(239, 68, 68, 0.22);
        color: white;
    }

    .main-panel {
        background: var(--bg-card);
        border-radius: 20px;
        padding: 20px;
        box-shadow: var(--shadow-main);
        border: 1px solid rgba(255,255,255,0.04);
        min-height: 76vh;
    }

    @media (max-width: 900px) {
        .app-layout {
            grid-template-columns: 1fr;
        }

        .side-bar {
            position: static;
        }
    }
</style>

{% block additional_styles %}{% endblock %}
{% endblock %}

{% block content %}
<div class="app-wrap">
    <div class="container-fluid">
        <div class="app-layout">
            <aside class="side-bar">
                <div class="user-box">
                    <div class="user-name">{{ user.username }}</div>
                    <p class="user-sub">Daily Moo_dle</p>
                </div>

                <div class="side-links">
                    <a href="/app" class="side-link {% if request.path == '/app' %}active{% endif %}">Game</a>
                    <a href="/leaderboard" class="side-link {% if request.path == '/leaderboard' %}active{% endif %}">Leaderboard</a>
                    <a href="/history" class="side-link {% if request.path == '/history' %}active{% endif %}">History</a>
                </div>

                <a href="/logout" class="logout-link">Logout</a>
            </aside>

            <main class="main-panel">
                {% block subpage_content %}{% endblock %}
            </main>
        </div>
    </div>
</div>
{% endblock %}
